name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия образа для production'
        required: false
        default: 'latest'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy ccache wrk
      
      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      
      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      
      - name: Build
        run: cmake --build build
      
      - name: Run unit tests
        run: cd build && ctest --output-on-failure
      
      - name: Run integration tests
        run: |
          ./build/app &
          PID=$!
          sleep 3
          chmod +x tests/integration_test.sh
          bash tests/integration_test.sh
          kill $PID
      
      - name: Static analysis
        run: clang-tidy src/main.cpp -- -I.

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Build and push
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=ghcr.io/${REPO_LOWER}:latest
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker run -d --name staging-app -p 8080:8080 ghcr.io/${REPO_LOWER}:latest
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health
      
      - name: Save logs
        if: always()
        run: docker logs staging-app > staging_logs.txt
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: staging_logs.txt
      
      - name: Save metrics
        run: curl -s http://localhost:8080/metrics > staging_metrics.txt
      
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: staging-metrics
          path: staging_metrics.txt

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Blue-green deploy
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="latest"
          IMAGE=ghcr.io/${REPO_LOWER}:${VERSION}
          
          docker run -d --name app-green -p 8081:8080 $IMAGE
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8081/health
          
          docker stop app-blue 2>/dev/null || true
          docker run -d --name app-blue -p 8080:8080 $IMAGE
          sleep 3
          curl --fail http://localhost:8080/health
          
          docker stop app-green && docker rm app-green
      
      - name: Save logs
        if: always()
        run: docker logs app-blue > production_logs.txt
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: production-logs
          path: production_logs.txt
      
      - name: Save metrics
        run: curl -s http://localhost:8080/metrics > production_metrics.txt
      
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: production-metrics
          path: production_metrics.txt

  notification:
    if: always()
    needs: [build-and-test, docker-build-push, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Generate report
        run: |
          echo "==== CI/CD Pipeline Notification ===" > report.txt
          echo "Repository: ${{ github.repository }}" >> report.txt
          echo "Run number: ${{ github.run_number }}" >> report.txt
          echo "Triggered by: ${{ github.actor }}" >> report.txt
          echo "Event: ${{ github.event_name }}" >> report.txt
          echo "Date: $(date)" >> report.txt
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: notification-report-${{ github.run_id }}
          path: report.txt
