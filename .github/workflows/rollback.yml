name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия образа для отката'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Rollback
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker stop app-blue 2>/dev/null || true
          docker run -d --name app-blue -p 8080:8080 ghcr.io/${REPO_LOWER}:${{ github.event.inputs.version }}
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health
          echo "Rollback to ${{ github.event.inputs.version }} completed" >> rollback.log
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs
          path: rollback.log
